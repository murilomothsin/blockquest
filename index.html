<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#14182a" />
  <title>BlockQuest RPG</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="panel" id="stats">
      <div class="row"><b id="pname">Aventureiro</b> <span class="lvl">Nv <span id="level">1</span></span></div>
      <div class="bar hp"><div id="hpfill"></div><span id="hptext"></span></div>
      <div class="bar xp"><div id="xpfill"></div><span id="xptext"></span></div>
      <div class="row" id="pclass"></div>
      <div class="row small"><i class="coin"></i> <span id="gold">0</span> &nbsp; 🧪 <span id="potions">0</span> &nbsp; ⚗️ <span id="bigpotions">0</span> &nbsp; <span title="Um item cai a cada 5 abates">🎁 <span id="drop">0/5</span></span></div>
      <div class="row small" id="weapon"></div>
      <div class="row small" id="defense"></div>
    </div>
    <div class="panel" id="quest"></div>
    <canvas id="minimap" width="170" height="170"></canvas>
    <div id="region"></div>
  </div>
  <button id="skillbtn" class="hidden"><span class="sicon"></span><span class="skey"></span><span class="scd"></span></button>

  <div id="bossbar" class="hidden"><div id="bossname"></div><div class="bar boss"><div id="bossfill"></div></div></div>
  <div id="prompt" class="hidden"></div>
  <div id="log"></div>
  <div id="floats"></div>
  <div id="rotate">📱↻ Deite o celular para jogar melhor</div>
  <div id="controls" class="panel"></div>

  <div id="account" class="hidden">
    <span id="netstatus"></span>
    <button id="logout" class="mini secondary">Sair</button>
  </div>

  <div id="chat" class="hidden">
    <div id="chatlog"></div>
    <input id="chatinput" class="hidden" maxlength="200" autocomplete="off" placeholder="Mensagem para todos · /w nome msg = privado · /ajuda" />
  </div>

  <div id="login" class="hidden">
    <div class="lbox">
      <h1>⚔️ BlockQuest</h1>
      <p class="lsub">RPG de blocos no navegador</p>
      <div class="ltabs">
        <button type="button" id="ltab-login" class="tab active">Entrar</button>
        <button type="button" id="ltab-register" class="tab">Criar conta</button>
      </div>
      <form id="lform">
        <label>Usuário<input id="luser" autocomplete="username" maxlength="16" required /></label>
        <label>Senha<input id="lpass" type="password" autocomplete="current-password" maxlength="128" required /></label>
        <label id="lconfirm-row" class="hidden">Confirmar senha<input id="lconfirm" type="password" autocomplete="new-password" maxlength="128" /></label>
        <div id="lerror"></div>
        <button id="lsubmit" type="submit">Entrar</button>
      </form>
      <button id="loffline" type="button" class="secondary">Jogar offline (sem conta)</button>
    </div>
  </div>

  <div id="dialog" class="hidden">
    <div id="dtitle"></div>
    <div id="dtext"></div>
    <div id="dbuttons"></div>
  </div>

  <div id="modal-bg" class="hidden">
    <div id="modal">
      <div id="mhead"><div id="mtitle"></div><button id="mclose" class="secondary">✕</button></div>
      <div id="mtabs"></div>
      <div id="mbody"></div>
    </div>
  </div>

  <div id="death" class="hidden">
    <h1>Você caiu!</h1>
    <div id="deathinfo"></div>
    <button id="respawn">Renascer na vila</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
